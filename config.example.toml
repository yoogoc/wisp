# Pick one provider by name. Remove this line to disable AI suggestions.
default_provider = "local"

# Maximum number of ranked completion candidates kept by the daemon.
# 0 means unlimited; the overlay still shows eight rows at a time and scrolls.
[completion]
max_candidates = 0

[providers.local]
type = "openai-compatible"
base_url = "http://127.0.0.1:11434/v1"
model = "qwen2.5-coder"
timeout_ms = 800

# Remote OpenAI-compatible example:
#
# [providers.remote]
# type = "openai-compatible"
# base_url = "https://api.example.com/v1"
# model = "terminal-completion"
# api_key_env = "WISP_AI_API_KEY"
# timeout_ms = 800

# Fully custom provider example:
#
# [providers.custom]
# type = "process"
# command = ["/usr/local/bin/my-wisp-provider"]
# timeout_ms = 800
