# Pick one provider by name. Remove this line to disable AI suggestions.
default_provider = "local"

# Maximum number of ranked completion candidates kept by the daemon.
# 0 means unlimited; the overlay still shows eight rows at a time and scrolls.
# Recency uses Fig's priority bands and persists accepted candidates locally.
[completion]
max_candidates = 0
recency = true

# Static RON generator process limits.
[generator]
timeout_ms = 500
max_output_bytes = 262144
cache_ttl_ms = 3000
history_limit = 2000
# Additional executables trusted by the user beyond Wisp's built-in allowlist.
# Example: allowed_programs = ["my-generator"]
allowed_programs = []
# Generator stdout beginning with one of these strings is treated as an error.
reject_prefixes = ["fatal:", "error:", "ERR_PNPM"]

# AI request behavior shared by every provider.
[ai]
debounce_ms = 120
min_command_chars = 3
max_output_chars = 256
temperature = 0.1
max_tokens = 64
provider_error_chars = 512

# Candidate window layout and animation.
[overlay]
max_visible_candidates = 8
max_path_label_width = 40
width = 440.0
row_horizontal_padding = 10.0
icon_width = 24.0
icon_gap = 8.0
description_gap = 12.0
min_label_width = 48.0
max_label_width = 220.0
text_column_width = 7.0
description_scroll_pause_ms = 700
description_scroll_end_pause_ms = 500
description_scroll_speed = 34.0
cursor_gap = 8.0
scroll_step_pixels = 18.0
detail_width = 400.0
detail_window_gap = 8.0
row_height = 32.0
ghost_row_height = 30.0
detail_min_height = 96.0
detail_max_height = 560.0
detail_line_height = 18.0
detail_columns = 54
frame_interval_ms = 16
activity_check_ms = 100
reconnect_ms = 250

[daemon]
overlay_channel_capacity = 64

# Environment variables WISP_ALACRITTY_TITLEBAR/PADDING_X/PADDING_Y still
# override these values for one-off calibration.
[terminal]
alacritty_titlebar = 28.0
alacritty_padding_x = 0.0
alacritty_padding_y = 0.0
window_frame_cache_ms = 250

[startup]
attempts = 100
retry_ms = 50

[providers.local]
type = "openai-compatible"
base_url = "http://127.0.0.1:11434/v1"
model = "qwen2.5-coder"
timeout_ms = 800

# Remote OpenAI-compatible example:
#
# [providers.remote]
# type = "openai-compatible"
# base_url = "https://api.example.com/v1"
# model = "terminal-completion"
# api_key_env = "WISP_AI_API_KEY"
# timeout_ms = 800

# Fully custom provider example:
#
# [providers.custom]
# type = "process"
# command = ["/usr/local/bin/my-wisp-provider"]
# timeout_ms = 800
