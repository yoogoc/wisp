<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Wisp</title>
  <desc id="desc">Terminal autocomplete, without leaving the terminal</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#102540"/>
      <stop offset="1" stop-color="#17203b"/>
    </linearGradient>
    <linearGradient id="wisp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.52" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".24"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93c5fd" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="155" cy="175" r="180" fill="url(#glow)"/>
  <circle cx="1030" cy="20" r="230" fill="url(#glow)" opacity=".55"/>

  <g transform="translate(125 70)">
    <circle cx="110" cy="110" r="94" fill="#07111f" stroke="#60a5fa" stroke-opacity=".28" stroke-width="2"/>
    <path d="M52 147c25-6 37-19 39-39 2-16-9-25-2-45 5-15 18-27 39-35-10 19-10 34-1 45 9 12 28 13 33 32 6 21-11 42-39 51-25 8-52 4-69-9Z" fill="url(#wisp)" filter="url(#soft-glow)" opacity=".42"/>
    <path d="M52 147c25-6 37-19 39-39 2-16-9-25-2-45 5-15 18-27 39-35-10 19-10 34-1 45 9 12 28 13 33 32 6 21-11 42-39 51-25 8-52 4-69-9Z" fill="url(#wisp)"/>
    <path d="M61 171c32 15 76 9 98-16" fill="none" stroke="#e0f2fe" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
    <circle cx="166" cy="83" r="4" fill="#f0abfc"/>
    <circle cx="55" cy="77" r="3" fill="#67e8f9"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="390" y="160" fill="#f8fafc" font-size="84" font-weight="700" letter-spacing="5">WISP</text>
    <text x="395" y="211" fill="#a5b4c9" font-size="23">terminal autocomplete, without leaving the terminal</text>
    <g transform="translate(395 250)">
      <rect width="360" height="42" rx="10" fill="#050b14" stroke="#334155"/>
      <text x="17" y="28" fill="#67e8f9" font-size="17">❯</text>
      <text x="44" y="28" fill="#e2e8f0" font-size="17">git che</text>
      <text x="112" y="28" fill="#a78bfa" font-size="17">ckout feature/wisp</text>
    </g>
  </g>

  <path d="M1176 24v312a24 24 0 0 1-24 24H24" fill="none" stroke="url(#wisp)" stroke-opacity=".3"/>
</svg>
