[workspace]
resolver = "3"
members = [
    "crates/wisp-ai",
    "crates/wisp-cli",
    "crates/wisp-config",
    "crates/wisp-core",
    "crates/wisp-daemon",
    "crates/wisp-overlay",
    "crates/wisp-platform",
    "crates/wisp-protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1.0.99"
async-trait = "0.1.89"
clap = { version = "4.5.46", features = ["derive", "env"] }
cocoa = "0.26.0"
directories = "6.0.0"
dispatch = "0.2.0"
futures = "0.3.31"
flate2 = { version = "1.1.2", default-features = false, features = ["rust_backend"] }
gpui = "=0.2.2"
nucleo-matcher = "0.3.1"
objc = "0.2.7"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
ron = "0.11.0"
raw-window-handle = "0.6.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
strip-ansi-escapes = "0.2.1"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["codec", "rt"] }
toml = "0.9.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
unicode-width = "0.2.1"
url = "2.5.7"
wisp-ai = { path = "crates/wisp-ai" }
wisp-config = { path = "crates/wisp-config" }
wisp-core = { path = "crates/wisp-core" }
wisp-platform = { path = "crates/wisp-platform" }
wisp-protocol = { path = "crates/wisp-protocol" }
